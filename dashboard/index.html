<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Code Analyzer</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    
</head>
<body>

    <h1 Align="center"> Static Code Analyzer</h1>
    <h3 Align="center"> Upload a python file to detect security  vulnerabilities </h3>

    <div class="button-card"> 
        <div class="file-row">
            <input type="file" id="fileInput" style="display: none;"> 
            <label for="fileInput" id="fileLabel"> Upload a file</label>
            <span id="fileDescription">Choosing a python file</span>
        </div>
        <button id="analyzerbtn" > Analyze</button>
    </div>

    <div id="results"></div>

</body>
</html>
